services:
  - type: web
    name: pista-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PROJECT_NAME
        value: "PISTA Transaction Intelligence API"
      - key: VERSION
        value: "1.0.0"
      - key: API_V1_PREFIX
        value: "/api/v1"
