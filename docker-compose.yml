version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: pista-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pista_db}
      POSTGRES_USER: ${POSTGRES_USER:-pista_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pista_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pista_user} -d ${POSTGRES_DB:-pista_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pista-network

  # 2. FastAPI ML Decision Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pista-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=PISTA Transaction Intelligence API
      - VERSION=1.0.0
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pista_user}:${POSTGRES_PASSWORD:-pista_secure_password}@postgres:5432/${POSTGRES_DB:-pista_db}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pista-network

  # 3. Next.js Premium Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: pista-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pista-network

volumes:
  postgres_data:
    driver: local

networks:
  pista-network:
    driver: bridge
