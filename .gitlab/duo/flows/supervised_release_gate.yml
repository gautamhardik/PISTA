# ==============================================================================
# GitLab Duo Custom Flow: Supervised Release Gate
# Trigger: Post-Staging Deployment on Google Cloud Run
# ==============================================================================

name: "supervised_release_gate"
description: >
  Orchestrates the Supervised Autonomy gate: verifies staging deployment health,
  polls real-time telemetry metrics, generates compliance artifacts, and waits
  for human sign-off before production promotion.

trigger:
  event: "job_success"
  job_name: "release:staging_deployment"

steps:
  - id: "probe_staging_telemetry"
    action: "query_telemetry"
    params:
      staging_url: "https://pista-backend-staging-run.app"
      duration_seconds: 30
    output_variable: "telemetry_metrics"

  - id: "validate_governance_invariants"
    action: "reasoning"
    prompt: |
      Verify the telemetry metrics against PISTA production thresholds:
      - p50 latency must be < 50.0 ms (Observed: {{telemetry_metrics.p50}} ms)
      - p99 latency must be < 200.0 ms (Observed: {{telemetry_metrics.p99}} ms)
      - Error rate must be 0.0% (Observed: {{telemetry_metrics.error_rate}}%)
      - Brier score calibration must be < 0.03

      If all pass, draft the Executive Release Audit Note.
    output_variable: "audit_summary"

  - id: "request_human_approval"
    action: "request_supervisor_approval"
    params:
      title: "🚀 Production Release Authorization Required — PISTA v1.0.0"
      summary: |
        ### GitLab Duo Autopilot Supervised Gate Summary
        The automated DevSecOps lifecycle has completed across all 8 stages:
        - **Verify**: 12/12 unit and integration tests passed.
        - **Secure**: 0 secret leaks detected; HMAC cryptographic invariants intact.
        - **Package**: Docker container images built and verified.
        - **Staging URL**: [Google Cloud Run Staging](https://pista-backend-staging-run.app)
        - **Telemetry**: p50 = {{telemetry_metrics.p50}}ms | p99 = {{telemetry_metrics.p99}}ms | Error Rate = 0.0%

        👉 **Action Required**: Click **Approve** in the GitLab environment to trigger production deployment.
